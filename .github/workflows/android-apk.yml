name: Kurdo Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK 35 paketlerini kur
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Debug APK derle
        run: gradle --no-daemon :app:assembleDebug
      - name: APK dosyasini indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: Kurdo-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Sürüm etiketini al
        id: version
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: APK sürümünü yayımla
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kurdo ${{ steps.version.outputs.tag }}
          body: Kurdo Android için indirilebilir debug APK.
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
